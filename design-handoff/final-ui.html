<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anonymous Voice Chat — Final UI</title>
<style>
:root{color-scheme:light;--brand:#6258D9;--pressed:#5148C2;--canvas:#F7F8FC;--screen:#FCFCFE;--surface:#fff;--field:#F4F3FB;--lilac:#F0EEFF;--text:#25243A;--muted:#73748A;--icon:#85869C;--border:#E7E8F0;--online:#268A78;--danger:#C84E5A;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--text);font-family:var(--font)}body{min-height:100svh;display:grid;place-items:center;padding:16px}button,input{font:inherit}button{color:inherit;cursor:pointer}
.device{width:min(100%,390px);height:min(844px,calc(100svh - 32px));min-height:720px;display:flex;flex-direction:column;position:relative;overflow:hidden;border:1px solid #e4e2ec;border-radius:38px;background:var(--screen);box-shadow:0 24px 72px rgb(53 45 104 / 16%)}
.status{height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:650;background:var(--screen)}
.screen{flex:1;min-height:0;overflow:auto;padding:16px 20px 24px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.header h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.04em}.header p{margin:5px 0 0;color:var(--muted);font-size:14px}.header-actions{display:flex;align-items:center;gap:8px}.icon-action{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--field);color:var(--brand)}.icon-action svg{width:20px;height:20px}.avatar-action{width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--lilac)}
.avatar-action{width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--lilac)}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;margin-bottom:22px;border:1px solid var(--border);border-radius:12px;background:var(--field);color:var(--icon)}.search.compact{height:40px;min-height:40px;padding-inline:10px;margin-bottom:14px;gap:7px}.search.compact svg{width:16px;height:16px}.search input{flex:1 1 auto;min-width:0;width:auto;height:28px;margin:0;padding:0;border:0;border-radius:0;outline:0;background:transparent;color:var(--text);font-size:14px}.search input::placeholder{color:var(--muted)}
.code-input{display:block;width:100%;height:44px;margin:0 0 14px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--field);color:var(--text);font:14px var(--font)}.code-input::placeholder{color:var(--muted)}.code-input:focus{outline:3px solid rgb(98 88 217 / 22%);outline-offset:2px}
.section{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}.section h2{margin:0;font-size:16px;font-weight:650}.count{color:var(--muted);font-size:13px;font-weight:450}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;white-space:nowrap}.btn.primary{border-color:transparent;background:var(--brand);color:#fff}.btn.secondary{color:var(--brand);border-color:#dedbfa}.btn:active{background:var(--lilac)}.btn:disabled{opacity:.6}
.card{padding:16px;margin-bottom:12px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.room-title{margin:0;font-size:16px;font-weight:650}.description{margin:5px 0 15px;color:var(--muted);font-size:14px;line-height:1.45}.room-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}.avatars{display:flex;align-items:center}.avatars .alien+.alien{margin-left:-10px}.more{padding-left:6px;color:var(--muted);font-size:13px}.total{margin-left:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.alien{--c:#9B8FEB;position:relative;flex:0 0 44px;width:44px;height:44px;display:inline-grid;place-items:center;overflow:hidden;border:2px solid var(--surface);border-radius:15px;background:color-mix(in srgb,var(--c) 17%,white)}.alien:before{content:"";width:25px;height:29px;border-radius:48% 48% 42% 42%;background:var(--c)}.alien:after{content:"";position:absolute;top:4px;right:8px;width:7px;height:11px;border-radius:7px 7px 2px 7px;background:var(--c);transform:rotate(14deg)}.aqua{--c:#4BB8AC}.aqua:before{width:29px;height:25px;border-radius:45% 45% 55% 55%}.aqua:after{top:7px;right:4px;width:10px;height:8px}.coral{--c:#E98D7F}.coral:before{border-radius:42% 58% 49% 51%}.coral:after{left:7px;right:auto;transform:rotate(-20deg)}.gold{--c:#D7A845}.gold:before{width:24px;height:31px;border-radius:55% 45% 45% 55%}.blue{--c:#7797DB}.blue:before{width:29px;height:28px;border-radius:52% 48% 58% 42%}
.list{list-style:none;padding:0;margin:0}.row{min-height:68px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}.copy{flex:1;min-width:0}.name{display:block;overflow:hidden;font-size:14px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.meta{display:block;margin-top:3px;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.chevron{color:var(--icon);font-size:23px}
.screen.chat-open{overflow:hidden;padding-bottom:0}.message-screen{height:100%;min-height:0;display:flex;flex-direction:column}.message-head{min-height:52px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}.message-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:18px 0;overflow:auto}.bubble{max-width:82%;padding:10px 13px;border-radius:16px;background:var(--field);font-size:14px;line-height:1.4}.bubble.sent{align-self:flex-end;border-bottom-right-radius:5px;background:var(--lilac)}.bubble.received{align-self:flex-start;border-bottom-left-radius:5px}.composer{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-top:0;padding:10px 0;border-top:1px solid var(--border);background:var(--screen)}.composer input{flex:1;min-width:0;height:46px;padding:0 14px;border:1px solid var(--border);border-radius:23px;background:var(--field);font-size:14px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;margin-bottom:16px}.connected{display:flex;align-items:center;gap:7px;color:var(--online);font-size:13px;font-weight:600}.dot{width:8px;height:8px;border-radius:50%;background:var(--online)}.actions{display:flex;gap:8px}.actions .btn{min-height:40px;padding:0 11px;font-size:13px}
.rail{display:flex;gap:8px;overflow:auto;padding-right:8px;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.active-card{width:168px;min-width:168px;min-height:58px;display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:14px;background:var(--surface);scroll-snap-align:start}.active-card .alien{width:36px;height:36px;flex-basis:36px;border-radius:13px}.active-card .alien:before{width:22px;height:24px}.active-card .active-name{min-width:0;overflow:hidden;font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.digit{margin-left:auto;color:var(--brand);font-size:12px;font-weight:650}
.request{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.request .actions{gap:5px}.request .btn{min-height:38px;padding:0 9px;font-size:12px}
.chat-row{width:100%;min-height:76px;display:flex;align-items:center;gap:12px;padding:0;border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left}.chat-row .alien{width:48px;height:48px;flex-basis:48px}.time{align-self:flex-start;padding-top:16px;color:var(--muted);font-size:11px}
.nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(44px,1fr));align-items:center;min-height:76px;padding:7px 8px max(9px,env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--screen)}.nav-item{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--icon);font-size:11px;font-weight:500}.nav-item.active{color:var(--brand);font-weight:650}.nav-item svg{width:22px;height:22px}.center-slot{height:60px;display:grid;place-items:center}.center{width:56px;height:56px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--brand);color:#fff;box-shadow:0 5px 13px rgb(98 88 217 / 23%)}.center svg{width:25px;height:25px}
.rail-section{margin-top:19px}.friend-row{min-height:66px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}.notice{padding:12px;margin:14px 0;border-radius:12px;background:var(--lilac);color:#49418d;font-size:13px;line-height:1.45}.menu{margin-top:18px;border-top:1px solid var(--border)}.menu button{width:100%;min-height:58px;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left;font-size:14px}.menu span:last-child{margin-left:auto;color:var(--icon);font-size:20px}
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;background:rgb(30 26 51 / 35%)}.sheet{width:100%;padding:12px 20px calc(22px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:var(--screen)}.handle{width:38px;height:4px;margin:0 auto 18px;border-radius:5px;background:#d8d6e2}.sheet h2{margin:0;font-size:21px;letter-spacing:-.03em}.sheet p{margin:5px 0 14px;color:var(--muted);font-size:14px;line-height:1.4}.sheet label{display:block;margin:14px 0 7px;font-size:13px;font-weight:600}.sheet input{width:100%;height:48px;padding:0 13px;border:1px solid var(--border);border-radius:12px;background:var(--field);font-size:14px}.sheet .btn{width:100%;margin-top:15px}
.toast{position:absolute;z-index:8;left:50%;bottom:90px;transform:translateX(-50%);padding:11px 15px;border-radius:24px;background:#302d42;color:#fff;font-size:13px;white-space:nowrap}
@media(max-width:500px){body{display:block;padding:0;background:var(--screen)}.device{width:100%;height:100svh;min-height:620px;border:0;border-radius:0;box-shadow:none}.screen{padding-top:16px}}
@media(max-width:360px){.screen{padding-inline:16px}.card{padding:14px}.request .btn{padding-inline:7px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="device" aria-label="Anonymous voice chat app preview">
<div class="status"><span>9:41</span><span>●  ▰</span></div>
<div id="screen" class="screen"></div>
<nav class="nav" aria-label="Main navigation">
<button class="nav-item" data-tab="Chats"><span class="nav-icon"></span><span>Chats</span></button>
<button class="nav-item" data-tab="Friends"><span class="nav-icon"></span><span>Friends</span></button>
<div class="center-slot"><button id="center" class="center" aria-label="Open Voice"></button></div>
<button class="nav-item" data-tab="Invites"><span class="nav-icon"></span><span>Invites</span></button>
<button class="nav-item" data-tab="Profile"><span class="nav-icon"></span><span>Profile</span></button>
</nav><div id="overlay"></div><div id="toast"></div></div>
<script>
const screen=document.getElementById('screen'), overlay=document.getElementById('overlay'), center=document.getElementById('center'), toast=document.getElementById('toast');
const icon={
Chats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-2 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/></svg>',
Friends:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5a3 3 0 0 1 0 6M17 14a4.5 4.5 0 0 1 3.5 4"/></svg>',
Invites:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>',
Profile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>',
mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6M3 3l18 18"/></svg>',
micOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>',
shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m16 3 4 4-4 4M4 7h2c5 0 7 10 12 10h2M16 14l4 3-4 3M4 17h2c2 0 3-2 4-4"/></svg>',
search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6M9 12h11"/></svg>'
};
const a=(kind)=>'<span class="alien '+(kind||'')+'" aria-hidden="true"></span>';
let tab='Voice',room=false,muted=true,chat='',roomSearch='',chatFilter='',friendFilter='',roster=[['Mira','aqua','Listening'],['Asha','','Speaking'],['Ravi','coral','Listening'],['Sam','gold','','You']];
const rooms=[
 {id:'r1',code:'4821',title:'The open table',desc:'Easy conversation, any topic is welcome.',avatars:['aqua','','coral'],more:1,count:4,roster:[['Mira','aqua','Listening'],['Asha','','Speaking'],['Ravi','coral','Listening'],['Sam','gold','','You']]},
 {id:'r2',code:'1736',title:'A little company',desc:'Drop in, say hello, and see where it goes.',avatars:['','blue','aqua'],more:0,count:3,roster:[['Nia','','Listening'],['Leo','blue','Speaking'],['Sam','gold','','You']]},
 {id:'r3',code:'6042',title:'Around the table',desc:'A relaxed place to share a thought or two.',avatars:['coral','gold','blue'],more:1,count:4,roster:[['Tara','coral','Listening'],['Milo','gold','Speaking'],['Noor','blue','Listening'],['Sam','gold','','You']]}
];
let roomIndex=0;
function head(title,sub,action){return '<header class="header"><div><h1>'+title+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(action||'')+'</header>'}
function search(ph,id,value,compact){return '<label class="search'+(compact?' compact':'')+'">'+icon.search+'<input id="'+id+'" '+(id==='room-code'?'inputmode="numeric"':'')+' placeholder="'+ph+'" value="'+(value||'')+'"></label>'}
function card(r){return '<article class="card"><h3 class="room-title">'+r.title+'</h3><p class="description">'+r.desc+'</p><div class="room-bottom"><div class="room-social"><div class="avatars">'+r.avatars.map(a).join('')+(r.more?'<span class="more">+'+r.more+'</span>':'')+'</div><span class="total">'+r.count+' people</span></div><button class="btn primary" data-join="'+r.id+'">Join</button></div></article>'}
function voice(){return head('Voice','Find a room that feels right.','<div class="header-actions"><button class="icon-action" data-search="true" aria-label="Search rooms by code">'+icon.search+'</button><button class="avatar-action" data-go-profile="true" aria-label="Open profile">'+a('gold')+'</button></div>')+'<div class="section"><h2>Open rooms</h2></div>'+rooms.map(card).join('')+'<p class="meta" style="text-align:center;padding:10px">Small rooms make it easier for everyone to be heard.</p>'}
function roomScreen(){let rows=roster.map(p=>'<li class="row">'+a(p[1])+'<div class="copy"><span class="name">'+p[0]+(p[3]?'<span class="count"> · '+p[3]+'</span>':'')+'</span>'+(p[2]?'<span class="meta">'+p[2]+'</span>':'')+'</div><span class="chevron">›</span></li>').join('');return '<div class="toolbar"><span class="connected"><i class="dot"></i>Connected</span><div class="actions"><button class="btn" data-invite>Invite</button><button class="btn" data-leave>Leave room</button></div></div><div class="section"><h2>People <span class="count">· '+roster.length+'</span></h2><button class="btn secondary" data-shuffle>'+icon.shuffle+'Shuffle</button></div><ul class="list">'+rows+'</ul>'}
const chatData=[['Mira','aqua','That sounds good, see you there.','2:41'],['Asha','','I found a room we might like.','Yesterday'],['Ravi','coral','Thanks for the recommendation!','Mon']];
function chats(){let visible=chatData.filter(c=>(c[0]+' '+c[2]).toLowerCase().includes(chatFilter.toLowerCase()));return head('Chats','Your private conversations.','<button class="avatar-action" data-go-profile aria-label="Open profile">'+a('gold')+'</button>')+search('Search chats','chat-search',chatFilter,true)+(visible.length?visible.map(c=>'<button class="chat-row" data-chat="'+c[0]+'">'+a(c[1])+'<span class="copy"><span class="name">'+c[0]+'</span><span class="meta">'+c[2]+'</span></span><span class="time">'+c[3]+'</span></button>').join(''):'<p class="meta">No conversations found.</p>')}
function friends(){let friendList=[['Mira','aqua'],['Asha',''],['Ravi','coral'],['Sam','gold']].filter(p=>p[0].toLowerCase().includes(friendFilter.toLowerCase()));return head('Friends','','<button class="btn secondary" data-add>＋ Add friend</button>')+search('Search your friends','friend-search',friendFilter,true)+'<section><div class="section"><h2>Friend requests</h2><span class="count">2</span></div>'+request('Nora','coral')+request('Jules','blue')+'</section><section class="rail-section"><div class="section"><h2>Active now</h2></div><div class="rail">'+active('Mira','aqua','4821')+active('Ravi','coral','1736')+active('Asha','','6042')+'</div></section><section class="rail-section"><div class="section"><h2>Your friends</h2></div>'+(friendList.length?friendList.map(p=>friend(p[0],p[1])).join(''):'<p class="meta">No friends found.</p>')+'</section>'}
function request(n,k){return '<div class="request">'+a(k)+'<span class="copy"><span class="name">'+n+'</span><span class="meta">@'+n.toLowerCase()+'</span></span><div class="actions"><button class="btn primary" data-toast="Request accepted">Accept</button><button class="btn" data-toast="Request declined">Decline</button></div></div>'}
function active(n,k,c){return '<div class="active-card">'+a(k)+'<span class="active-name">'+n+'</span><span class="digit">'+c+'</span></div>'}
function friend(n,k){return '<div class="friend-row">'+a(k)+'<span class="copy"><span class="name">'+n+'</span></span><button class="btn" data-chat="'+n+'">Chat</button></div>'}
function invites(){return head('Invites','Room invitations from your friends.')+inviteCard('Mira','aqua','The open table')+inviteCard('Ravi','coral','A little company')}
function inviteCard(n,k,title){return '<article class="card"><div class="row" style="border:0;min-height:50px">'+a(k)+'<span class="copy"><span class="name">'+n+' invited you</span><span class="meta">'+title+'</span></span></div><p class="description">Come join a relaxed conversation.</p><div class="actions"><button class="btn primary" data-invite-join>Join room</button><button class="btn" data-toast="Invite declined">Decline</button></div></article>'}
function profile(){return head('Profile')+'<div class="card row">'+a('gold')+'<span class="copy"><strong>SunnySide</strong><span class="meta">@sunnytalks</span></span></div><p class="notice">Your pseudonym and avatar are what others see. You never need to share your real name.</p><button class="btn secondary" data-edit>Edit profile</button><div class="menu">'+menu('Premium')+menu('Privacy & safety')+menu('Settings')+menu('Help & support')+'</div>'}
function menu(t){return '<button data-toast="'+t+'">'+t+'<span>›</span></button>'}
function message(){return '<div class="message-screen"><header class="message-head"><button class="btn" data-back>‹ Back</button><strong>'+chat+'</strong></header><div class="message-list"><div class="bubble received">Hey, glad we connected!</div><div class="bubble sent">Me too. How are you?</div></div><form id="composer" class="composer"><input id="message" placeholder="Message"><button class="btn primary" type="submit">Send</button></form></div>'}
function render(){screen.innerHTML=chat?message():tab==='Voice'?voice():tab==='Room'?roomScreen():tab==='Chats'?chats():tab==='Friends'?friends():tab==='Invites'?invites():profile();screen.classList.toggle('chat-open',Boolean(chat));document.querySelector('.nav').style.display=chat?'none':'grid';document.querySelectorAll('.nav-item').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.querySelector('.nav-icon').innerHTML=icon[b.dataset.tab]});let key=tab==='Room'?(muted?'mic':'micOn'):room?'back':tab==='Voice'?'plus':'wave';center.innerHTML=icon[key];center.setAttribute('aria-label',tab==='Room'?(muted?'Turn microphone on':'Turn microphone off'):room?'Return to room':tab==='Voice'?'Create room':'Open Voice')}
function toastIt(t){toast.innerHTML='<div class="toast" role="status">'+t+'</div>';setTimeout(()=>toast.innerHTML='',1800)}
function sheet(title,desc,fields,action){overlay.innerHTML='<div class="overlay"><section class="sheet"><div class="handle"></div><h2>'+title+'</h2><p>'+desc+'</p>'+fields+'<button class="btn primary" data-sheet-action="'+action+'">'+action+'</button><button class="btn" data-close>Close</button></section></div>'}
function codeSearch(){overlay.innerHTML='<div class="overlay"><section class="sheet"><div class="handle"></div><h2>Find a room</h2><p>Enter its four-digit code to find the room.</p><input class="code-input" id="room-code" inputmode="numeric" maxlength="4" placeholder="4-digit room code" aria-label="4-digit room code"><div id="code-result"><p class="meta">Enter all four digits to find a room.</p></div><button class="btn" data-close>Close</button></section></div>';document.getElementById('room-code').focus()}
function updateCodeResult(value){let result=document.getElementById('code-result');if(!result)return;if(value.length<4){result.innerHTML='<p class="meta">Enter all four digits to find a room.</p>';return}let found=rooms.find(r=>r.code===value);result.innerHTML=found?card(found):'<div class="empty"><strong>No room found</strong><p class="meta">Check the code and try again.</p><button class="btn" data-clear-search>Clear code</button></div>'}
function join(){room=true;tab='Room';muted=true;chat='';roster=rooms[roomIndex].roster.slice();render()}
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{chat='';tab=b.dataset.tab;render()});
center.onclick=()=>{if(tab==='Room'){muted=!muted;render();toastIt(muted?'Microphone off':'Microphone on')}else if(room){tab='Room';render()}else if(tab==='Voice'){sheet('Create a room','A small room for up to five people. We’ll generate a shareable code.','<label>Room name</label><input placeholder="Give your room a name"><label>Short description</label><input placeholder="What would you like to talk about?">','Create room')}else{tab='Voice';render()}};
screen.addEventListener('input',e=>{if(e.target.id!=='chat-search'&&e.target.id!=='friend-search')return;let id=e.target.id;let value=e.target.value;let pos=e.target.selectionStart;if(id==='chat-search')chatFilter=value;else friendFilter=value;render();let input=document.getElementById(id);input.focus();input.setSelectionRange(pos,pos)});
screen.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-search'))codeSearch();else if(b.hasAttribute('data-go-profile')){tab='Profile';render()}else if(b.dataset.join){roomIndex=Math.max(0,rooms.findIndex(r=>r.id===b.dataset.join));join()}else if(b.hasAttribute('data-invite-join')){roomIndex=1;join()}else if(b.hasAttribute('data-shuffle')){b.disabled=true;b.innerHTML=icon.shuffle+'Finding…';setTimeout(()=>{let choices=rooms.map((_,i)=>i).filter(i=>i!==roomIndex);roomIndex=choices[Math.floor(Math.random()*choices.length)];roster=rooms[roomIndex].roster.slice();muted=true;tab='Room';render();toastIt('Joined another room · mic off')},650)}else if(b.hasAttribute('data-invite')){sheet('Invite someone','Share this room code with a friend.','<div class="card" style="text-align:center"><span class="meta">ROOM CODE</span><h2>4821</h2></div>','Share code')}else if(b.hasAttribute('data-leave')){if(confirm('Leave this room? Your microphone will turn off.')){room=false;muted=true;tab='Voice';render()}}else if(b.dataset.chat){chat=b.dataset.chat;render()}else if(b.hasAttribute('data-back')){chat='';tab='Chats';render()}else if(b.hasAttribute('data-add'))sheet('Add a friend','Search by username and send a request.','<label>Username</label><input placeholder="Search a name or @handle">','Send request');else if(b.hasAttribute('data-edit'))sheet('Edit profile','Choose how friends recognize you.','<label>Pseudonym</label><input value="SunnySide"><label>Short bio</label><input placeholder="A little about you">','Save changes');else if(b.hasAttribute('data-toast'))toastIt(b.dataset.toast)});
overlay.addEventListener('input',e=>{if(e.target.id==='room-code'){roomSearch=e.target.value.replace(/[^0-9]/g,'').slice(0,4);e.target.value=roomSearch;updateCodeResult(roomSearch)}});
overlay.addEventListener('click',e=>{let b=e.target.closest('button');if(e.target.classList.contains('overlay')){overlay.innerHTML='';return}if(!b)return;if(b.hasAttribute('data-close'))overlay.innerHTML='';else if(b.hasAttribute('data-join')){roomIndex=Math.max(0,rooms.findIndex(r=>r.id===b.dataset.join));overlay.innerHTML='';join()}else if(b.dataset.chat){chat=b.dataset.chat;overlay.innerHTML='';render()}else if(b.hasAttribute('data-clear-search')){roomSearch='';let input=document.getElementById('room-code');input.value='';updateCodeResult('');input.focus()}else if(b.dataset.sheetAction){overlay.innerHTML='';if(b.dataset.sheetAction==='Create room')join();else toastIt(b.dataset.sheetAction==='Send request'?'Request sent':'Saved')}});
screen.addEventListener('submit',e=>{if(e.target.id!=='composer')return;e.preventDefault();let v=document.getElementById('message').value.trim();if(v)toastIt('Message sent')});
render();
</script>
</body></html>
